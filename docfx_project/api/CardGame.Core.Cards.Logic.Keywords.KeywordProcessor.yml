      description: The unit that is about to die.
    - id: context
      type: CardGame.Core.Application.GameContext
      description: The game context with additional services.
    - id: isSacrifice
      type: System.Boolean
      description: Whether the death is due to a sacrifice effect.
    return:
      type: System.Boolean
      description: True if death was prevented, otherwise false.
