      description: Event bus for publishing death events.
    - id: killerId
      type: System.Nullable{System.Int32}
      description: Optional ID of the unit that killed this unit.
    return:
      type: CardGame.Core.State.Models.GameState
      description: The updated game state after killing the unit.
