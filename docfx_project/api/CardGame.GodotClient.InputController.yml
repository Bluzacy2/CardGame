    id: _Process
    path: ../Source/CardGame.GodotClient/Scripts/InputController.cs
    startLine: 79
  assemblies:
  - CardGame.GodotClient
  namespace: CardGame.GodotClient
  summary: >-
    <p>Called on each idle frame, prior to rendering, and after physics ticks have been processed. <code class="paramref">delta</code> is the time between frames in seconds.</p>

    <p>It is only called if processing is enabled for this Node, which is done automatically if this method is overridden, and can be toggled with <xref href="Godot.Node.SetProcess(System.Boolean)" data-throw-if-not-resolved="false"></xref>.</p>

    <p>Processing happens in order of <xref href="Godot.Node.ProcessPriority" data-throw-if-not-resolved="false"></xref>, lower priority values are called first. Nodes with the same priority are processed in tree order, or top to bottom as seen in the editor (also known as pre-order traversal).</p>

    <p>Corresponds to the <xref href="Godot.Node.NotificationProcess" data-throw-if-not-resolved="false"></xref> notification in <xref href="Godot.GodotObject._Notification(System.Int32)" data-throw-if-not-resolved="false"></xref>.</p>

    <p><b>Note:</b> This method is only called if the node is present in the scene tree (i.e. if it's not an orphan).</p>

    <p><b>Note:</b> When the engine is struggling and the frame rate is lowered, <code class="paramref">delta</code> will increase. When <code class="paramref">delta</code> is increased, it's capped at a maximum of <xref href="Godot.Engine.TimeScale" data-throw-if-not-resolved="false"></xref> * <xref href="Godot.Engine.MaxPhysicsStepsPerFrame" data-throw-if-not-resolved="false"></xref> / <xref href="Godot.Engine.PhysicsTicksPerSecond" data-throw-if-not-resolved="false"></xref>. As a result, accumulated <code class="paramref">delta</code> may not represent real world time.</p>

    <p><b>Note:</b> When <code>--fixed-fps</code> is enabled or the engine is running in Movie Maker mode (see <xref href="Godot.MovieWriter" data-throw-if-not-resolved="false"></xref>), process <code class="paramref">delta</code> will always be the same for every frame, regardless of how much time the frame took to render.</p>

    <p><b>Note:</b> Frame delta may be post-processed by <xref href="Godot.OS.DeltaSmoothing" data-throw-if-not-resolved="false"></xref> if this is enabled for the project.</p>
  example: []
  syntax:
    content: public override void _Process(double delta)
    parameters:
    - id: delta
      type: System.Double
    content.vb: Public Overrides Sub _Process(delta As Double)
