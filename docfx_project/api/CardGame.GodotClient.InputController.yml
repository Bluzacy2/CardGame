  name: _UnhandledInput(InputEvent)
  nameWithType: InputController._UnhandledInput(InputEvent)
  fullName: CardGame.GodotClient.InputController._UnhandledInput(Godot.InputEvent)
  type: Method
  source:
    remote:
      path: Source/CardGame.GodotClient/Scripts/InputController.cs
      branch: main
      repo: https://github.com/Bluzacy2/CardGame
    id: _UnhandledInput
    path: ../Source/CardGame.GodotClient/Scripts/InputController.cs
    startLine: 94
  assemblies:
  - CardGame.GodotClient
  namespace: CardGame.GodotClient
  summary: >-
    <p>Called when an <xref href="Godot.InputEvent" data-throw-if-not-resolved="false"></xref> hasn't been consumed by <xref href="Godot.Node._Input(Godot.InputEvent)" data-throw-if-not-resolved="false"></xref> or any GUI <xref href="Godot.Control" data-throw-if-not-resolved="false"></xref> item. It is called after <xref href="Godot.Node._ShortcutInput(Godot.InputEvent)" data-throw-if-not-resolved="false"></xref> and after <xref href="Godot.Node._UnhandledKeyInput(Godot.InputEvent)" data-throw-if-not-resolved="false"></xref>. The input event propagates up through the node tree until a node consumes it.</p>

    <p>It is only called if unhandled input processing is enabled, which is done automatically if this method is overridden, and can be toggled with <xref href="Godot.Node.SetProcessUnhandledInput(System.Boolean)" data-throw-if-not-resolved="false"></xref>.</p>

    <p>To consume the input event and stop it propagating further to other nodes, <xref href="Godot.Viewport.SetInputAsHandled" data-throw-if-not-resolved="false"></xref> can be called.</p>

    <p>For gameplay input, this method is usually a better fit than <xref href="Godot.Node._Input(Godot.InputEvent)" data-throw-if-not-resolved="false"></xref>, as GUI events need a higher priority. For keyboard shortcuts, consider using <xref href="Godot.Node._ShortcutInput(Godot.InputEvent)" data-throw-if-not-resolved="false"></xref> instead, as it is called before this method. Finally, to handle keyboard events, consider using <xref href="Godot.Node._UnhandledKeyInput(Godot.InputEvent)" data-throw-if-not-resolved="false"></xref> for performance reasons.</p>

    <p><b>Note:</b> This method is only called if the node is present in the scene tree (i.e. if it's not an orphan).</p>
  example: []
  syntax:
    content: public override void _UnhandledInput(InputEvent @event)
    parameters:
    - id: event
      type: Godot.InputEvent
    content.vb: Public Overrides Sub _UnhandledInput([event] As InputEvent)
  overridden: Godot.Node._UnhandledInput(Godot.InputEvent)
  overload: CardGame.GodotClient.InputController._UnhandledInput*
