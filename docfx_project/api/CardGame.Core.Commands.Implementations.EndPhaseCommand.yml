  assemblies:
  - CardGame.Core
  namespace: CardGame.Core.Commands.Implementations
  summary: >-
    Signals the state machine to end the current phase and transition to the next phase.

    This command is an exception to the usual pattern - it does not modify game state directly

    but returns the current state unchanged, allowing the state machine to handle the phase transition.
  example: []
  syntax:
    content: public GameState Execute(GameState currentState, EventBus eventBus, GameContext context)
    parameters:
    - id: currentState
      type: CardGame.Core.State.Models.GameState
      description: The current game state.
    - id: eventBus
      type: CardGame.Core.Events.EventBus
      description: The event bus for publishing game events.
    - id: context
      type: CardGame.Core.Application.GameContext
      description: The game context with additional services.
    return:
      type: CardGame.Core.State.Models.GameState
      description: The current game state unchanged, signaling that phase transition logic should be handled elsewhere.
    content.vb: Public Function Execute(currentState As GameState, eventBus As EventBus, context As GameContext) As GameState
  overload: CardGame.Core.Commands.Implementations.EndPhaseCommand.Execute*
  implements:
